name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-npm:
    name: Publish to npm with provenance
    runs-on: ubuntu-latest
    # Optional hardening: create a "npm-publish" environment in repo settings
    # for an approval gate before publish. Uncomment next line after creation.
    # environment: npm-publish
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ".node-version"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm to latest (trusted publishing requires 11.5.1+)
        run: npm install -g "npm@11"

      - name: Verify versions match
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: package.json=$PKG_VERSION tag=$TAG_VERSION"
            exit 1
          fi

      - run: npm ci
      - name: Install rolldown native binding (workaround npm/cli#4828)
        run: npm install --no-save --force @rolldown/binding-linux-x64-gnu
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high

      # Poll registry up to 90s. Local publish race window covered — if maintainer
      # publishes from CLI around the same time as the tag push, the version will
      # appear here within the poll window and CI skips cleanly.
      - name: Idempotency check (poll registry for current version)
        id: check_version
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Polling registry for ${PKG_NAME}@${PKG_VERSION} (up to 90s)…"
          for i in $(seq 1 9); do
            if npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null | grep -q "^${PKG_VERSION}$"; then
              echo "already_published=true" >> "$GITHUB_OUTPUT"
              echo "::notice ::${PKG_NAME}@${PKG_VERSION} already on npm (attempt $i) — skipping publish step"
              exit 0
            fi
            sleep 10
          done
          echo "already_published=false" >> "$GITHUB_OUTPUT"
          echo "::notice ::${PKG_NAME}@${PKG_VERSION} not yet on npm — CI will attempt publish"

      - name: Detect available auth method
        id: detect_auth
        if: steps.check_version.outputs.already_published != 'true'
        env:
          HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          if [ "$HAS_NPM_TOKEN" = "true" ]; then
            echo "method=token" >> "$GITHUB_OUTPUT"
            echo "::notice ::Auth method: NPM_TOKEN secret"
          else
            echo "method=oidc-or-none" >> "$GITHUB_OUTPUT"
            echo "::notice ::Auth method: no NPM_TOKEN secret — will attempt OIDC trusted publishing"
          fi

      # Soft-fail publish: if no auth is available AND no trusted publisher is
      # configured on npmjs.com, this is treated as a "validation-only" CI run.
      # The workflow stays GREEN; maintainer publishes from local instead.
      # Hard failures (build break, test fail, version mismatch) are caught above.
      - name: Publish to npm
        if: steps.check_version.outputs.already_published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          npm publish --access public --provenance 2>&1 | tee /tmp/publish.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ $RC -eq 0 ]; then
            echo "::notice ::Published successfully"
            exit 0
          fi
          if grep -qE "ENEEDAUTH|need auth|401|403|Unable to authenticate" /tmp/publish.log; then
            PKG_NAME=$(node -p "require('./package.json').name")
            REPO_URL="https://github.com/${{ github.repository }}"
            echo "::warning ::CI publish skipped — no usable npm auth."
            echo "::warning ::Tests passed. To enable CI auto-publish, choose ONE:"
            echo "::warning ::  Option A (recommended, no tokens): configure trusted publishing"
            echo "::warning ::    → https://www.npmjs.com/package/${PKG_NAME}/access"
            echo "::warning ::    Add publisher: GitHub Actions, repo=${{ github.repository }}, workflow=publish.yml"
            echo "::warning ::  Option B: add NPM_TOKEN repo secret"
            echo "::warning ::    → ${REPO_URL}/settings/secrets/actions/new"
            echo "::warning ::Until then, maintainer must publish from local:"
            echo "::warning ::  npm publish --access public --provenance=false"
            exit 0
          fi
          echo "::error ::npm publish failed with non-auth error (exit $RC). See log above."
          exit $RC

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mcp-publisher
        run: |
          # Download to a file instead of piping curl into tar, so a sha256
          # verification can slot in once modelcontextprotocol/registry publishes
          # a checksums file (BSC-003). -f fails the job on an HTTP error.
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" -o mcp-publisher.tar.gz
          tar xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Validate server.json
        run: mcp-publisher validate server.json

      - name: Login via GitHub OIDC
        run: mcp-publisher login github-oidc

      - name: Publish to MCP registry (idempotent — ignores "already published")
        run: mcp-publisher publish server.json || echo "::notice ::MCP registry publish skipped (likely already at this version)"
