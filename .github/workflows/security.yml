name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit and CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Blocking gate: production dependencies only — that is what ships to
      # consumers. Remaining high advisories are transitive under
      # javascript-obfuscator (build-time devDependency) and npm's only fix is a
      # 5.4.3 -> 0.14.3 downgrade that breaks the obfuscation stage.
      - name: Dependency audit (production)
        run: pnpm audit --prod --audit-level high
      # Non-blocking: keeps dev-tree advisories visible rather than silenced.
      - name: Dependency audit (dev, informational)
        run: pnpm audit --audit-level high || true
      - name: Type check
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Test
        run: pnpm test
