name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit and CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ".node-version"
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install rolldown native binding (workaround npm/cli#4828)
        run: npm install --no-save --force @rolldown/binding-linux-x64-gnu
      # Blocking gate: production dependencies only — that is what ships to
      # consumers. Remaining high advisories are transitive under
      # javascript-obfuscator (build-time devDependency) and npm's only fix is a
      # 5.4.3 -> 0.14.3 downgrade that breaks the obfuscation stage.
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high
      # Non-blocking: keeps dev-tree advisories visible rather than silenced.
      - name: Dependency audit (dev, informational)
        run: npm audit --audit-level=high || true
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
