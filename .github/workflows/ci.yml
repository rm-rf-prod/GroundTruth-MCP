name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 6:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint-typecheck:
    name: Lint & Type check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "npm"
      - run: npm ci
      - name: Install rolldown native binding (workaround npm/cli#4828)
        run: npm install --no-save --force @rolldown/binding-linux-x64-gnu
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "npm"
      - run: npm ci
      - name: Install rolldown native binding (workaround npm/cli#4828)
        run: npm install --no-save --force @rolldown/binding-linux-x64-gnu
      - run: npm run test:coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [lint-typecheck, test]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "npm"
      - run: npm ci
      - name: Install rolldown native binding (workaround npm/cli#4828)
        run: npm install --no-save --force @rolldown/binding-linux-x64-gnu
      - run: npm run build
      # Blocking gate: only what actually ships to consumers. The remaining high
      # advisories are all transitive under javascript-obfuscator, a build-time
      # devDependency, and npm's only "fix" is a 5.4.3 -> 0.14.3 downgrade that
      # would break the obfuscation stage.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      # Non-blocking: keeps dev-tree advisories visible instead of silencing them.
      - name: Audit dev dependencies (informational)
        run: npm audit --audit-level=high || true
      - name: Check documentation URLs
        if: github.event_name == 'schedule'
        run: node scripts/check-urls.mjs
      - name: Upload dist
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dist
          path: dist/
          retention-days: 3
