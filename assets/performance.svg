</g>
<text x="1528" y="251.71428571428572" font-size="16" fill="#f1f5f3" text-anchor="end"><tspan fill="#f1f5f3" font-weight="700" font-size="30">28x</tspan><tspan fill="#a9b5b0" font-size="20"> faster</tspan></text>
<line x1="72" y1="287.92857142857144" x2="1528" y2="287.92857142857144" stroke="#1f2925"/>
<text x="72" y="340.14285714285717" font-size="21" fill="#f1f5f3">Spawn to MCP ready</text>
