<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="performance-title performance-desc">
<title id="performance-title">GroundTruth performance, before and after</title>
<desc id="performance-desc">Paired horizontal bars per metric, each row on its own scale. Startup (--version): before 1,130 ms, after 40 ms, 28x faster. Spawn to MCP ready: before 1,074 ms, after 186 ms, 5.8x faster. Next.js caching, cold cache: before 6,893 ms, after 259 ms, 27x faster. Next.js caching, next day (20 h old cache): before 6,684 ms, after 92 ms, 73x faster. Repeat search, new session: before 86 ms, after 2 ms, 43x faster. Tool list sent per session: before 23,638 bytes, after 11,560 bytes, 2.0x smaller. Memory at startup: before 194 MB, after 54 MB, 3.6x smaller.</desc>
<defs>
<style>
text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Ubuntu Sans', 'Helvetica Neue', Ubuntu, Arial, sans-serif; }
.m { font-family: 'JetBrains Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Ubuntu Sans Mono', 'Ubuntu Mono', 'DejaVu Sans Mono', monospace; }
.t { font-variant-numeric: tabular-nums; }
</style>

</defs>
<rect width="1600" height="900" fill="#0a0d0c"/>
<text x="72" y="104" font-size="36" font-weight="600" fill="#f1f5f3">Before and after</text>
<text x="72" y="144" font-size="21" fill="#a9b5b0">Bars are scaled per row. Lower is better unless a row says otherwise.</text>
<text x="1467.18" y="104" font-size="19" fill="#a9b5b0">After</text>
<rect x="1441.18" y="89" width="16" height="16" rx="4" fill="#00ae8b"/>
<text x="1342.29" y="104" font-size="19" fill="#a9b5b0">Before</text>
<rect x="1316.29" y="89" width="16" height="16" rx="4" fill="#5d6b66"/>
<text x="72" y="248.71428571428572" font-size="21" fill="#f1f5f3">Startup (--version)</text>
<g><title>Startup (--version), before: 1,130 ms</title>
