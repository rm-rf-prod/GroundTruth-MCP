<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="architecture-title architecture-desc">
<title id="architecture-title">GroundTruth request flow</title>
<desc id="architecture-desc">01 Client (any MCP agent over stdio or HTTP, or the gt-mcp CLI) calls one of 14 tools. 03 Resolve maps the name through the registry of 793 libraries, npm, PyPI, crates.io or Go modules. 04 Fetch chain tries llms.txt, Markdown negotiation, HTML to Markdown, GitHub docs, Reader fallback; the first good hit wins, with a memory LRU and disk cache beside it. 05 Sanitize filters prompt injection, blocks SSRF and strips boilerplate. 06 BM25 ranks sections against the topic within a token budget. 07 Evidence gate requires the topic terms in the source text or reports an honest miss. 08 The answer returns to the client with ranked excerpts, sources, fetch date and topic coverage.</desc>
<defs>
<style>
text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Ubuntu Sans', 'Helvetica Neue', Ubuntu, Arial, sans-serif; }
.m { font-family: 'JetBrains Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Ubuntu Sans Mono', 'Ubuntu Mono', 'DejaVu Sans Mono', monospace; }
.t { font-variant-numeric: tabular-nums; }
</style>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#66736e"/></marker>
<marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#66736e"/></marker>
<marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#00d4aa"/></marker>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
<feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/>
<feComponentTransfer in="b" result="g"><feFuncA type="linear" slope="0.9"/></feComponentTransfer>
<feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
